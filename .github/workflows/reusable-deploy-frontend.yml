name: Reusable Deploy Frontend Workflow

on:
  workflow_call:
    inputs:
      run_id:
        description: 'CI Workflow Run ID (optional, defaults to triggering/latest CI run)'
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      AWS_S3_FRONTEND_BUCKET:
        required: false
      CLOUDFRONT_DISTRIBUTION_ID:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Next.js Frontend & Invalidate CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: Alex-CD-Frontend-Deploy

      - name: Download Frontend Static Export Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-build
          path: frontend/out
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve S3 Bucket & CloudFront Distribution Targets
        id: resolve-targets
        run: |
          # Resolve S3 Bucket
          BUCKET="${{ secrets.AWS_S3_FRONTEND_BUCKET }}"
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "Searching AWS for frontend S3 bucket..."
            BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'alex-frontend-')].Name | [0]" --output text)
          fi
          echo "s3_bucket=$BUCKET" >> $GITHUB_OUTPUT

          # Resolve CloudFront Distribution ID
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Searching AWS for CloudFront distribution ID..."
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].DomainName, 'alex-frontend')].Id | [0]" --output text)
          fi
          echo "cloudfront_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Sync Static Frontend Artifacts to S3
        run: |
          BUCKET="${{ steps.resolve-targets.outputs.s3_bucket }}"
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "❌ Error: Could not resolve S3 bucket for Alex frontend deployment."
            exit 1
          fi
          echo "Syncing static frontend to s3://$BUCKET ..."
          aws s3 sync frontend/out/ s3://$BUCKET --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          DIST_ID="${{ steps.resolve-targets.outputs.cloudfront_id }}"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "⚠️ Warning: No CloudFront distribution ID found. Skipping invalidation."
          else
            echo "Creating CloudFront invalidation for distribution: $DIST_ID"
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi
